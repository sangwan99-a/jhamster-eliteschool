<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-student-heading"
        data-cy="StudentCreateUpdateHeading"
        jhiTranslate="schoolApp.student.home.createOrEditLabel"
      >
        Create or edit a Student
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="schoolApp.student.firstName" for="field_firstName">First Name</label>
          <input
            type="text"
            class="form-control"
            name="firstName"
            id="field_firstName"
            data-cy="firstName"
            formControlName="firstName"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="schoolApp.student.lastName" for="field_lastName">Last Name</label>
          <input
            type="text"
            class="form-control"
            name="lastName"
            id="field_lastName"
            data-cy="lastName"
            formControlName="lastName"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="schoolApp.student.email" for="field_email">Email</label>
          <input type="email" class="form-control" name="email" id="field_email" data-cy="email" formControlName="email" />
        </div>

        <div class="mb-3">
          <label class="form-label" jhiTranslate="schoolApp.student.phoneNumber" for="field_phoneNumber">Phone Number</label>
          <input
            type="text"
            class="form-control"
            name="phoneNumber"
            id="field_phoneNumber"
            data-cy="phoneNumber"
            formControlName="phoneNumber"
          />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
